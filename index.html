<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
BOLD AFTER DARK Scanner
</title>


<link rel="stylesheet" href="style.css">


<script src="https://unpkg.com/html5-qrcode"></script>


</head>


<body>


<div class="page">


<div class="header">


<img 
src="logo.png"
class="logo"
>


<div class="subtitle">
CHECK-IN SCANNER
</div>


</div>




<div class="scanner-card">


<div class="scanner-title">
SCAN QR PESERTA
</div>


<div id="reader"></div>


</div>





<div id="result" class="result waiting">


<div class="result-icon">
📷
</div>


Menunggu scan QR...


</div>





<div class="action-area">


<button
id="merchBtn"
class="button merch"
style="display:none"
onclick="takeMerch()"
>

AMBIL MERCH

</button>




<button
id="nextBtn"
class="button next"
style="display:none"
onclick="nextScan()"
>

SCAN BERIKUTNYA

</button>


</div>





<audio id="beep">

<source src="beep.mp3">

</audio>



</div>



<script src="scanner.js"></script>


</body>


</html>
